##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 1

windowrule = float on, match:modal 1

windowrule = float on, match:class ^(org\.pulseaudio\.pavucontrol)$

windowrule = float on, match:class ^(flameshot)$, match:title ^(Save screenshot)$

windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$

windowrule = float on, match:class ^(thunar)$, match:title ^(Rename \".+\")$

windowrule = float on, match:class ^(QQ)$, match:title ^(图片查看器)$

